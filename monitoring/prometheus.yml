global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

# APP_IP is replaced with the app server's private IP by the Jenkins pipeline
scrape_configs:
  - job_name: backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["APP_IP:8080"]

  - job_name: app-node
    static_configs:
      - targets: ["APP_IP:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["APP_IP:8081"]

  - job_name: monitoring-node
    static_configs:
      - targets: ["node-exporter:9100"]
